# $collectionIds comes from the discount's $app/function-variables metafield, named
# by input_variables in shopify.extension.toml. The argument it feeds is [ID!]!, so
# the variable carries its own default: if that metafield is ever missing the query
# still runs with an empty list, collection tiers simply match nothing, and the
# order-subtotal tiers keep paying out. Declaring it nullable instead would leave the
# behaviour to the server's discretion on the one path we can least afford to guess.
query CartInput($collectionIds: [ID!]! = []) {
  presentmentCurrencyRate
  cart {
    lines {
      id
      quantity
      cost {
        subtotalAmount {
          amount
        }
      }
      giftTier: attribute(key: "_gift") {
        value
      }
      merchandise {
        __typename
        ... on ProductVariant {
          product {
            id
            inCollections(ids: $collectionIds) {
              collectionId
              isMember
            }
          }
        }
      }
    }
  }
  discount {
    discountClasses
    appConfig: metafield(namespace: "$app", key: "function-configuration") {
      jsonValue
    }
    legacyConfig: metafield(namespace: "app", key: "function-configuration") {
      jsonValue
    }
  }
}
